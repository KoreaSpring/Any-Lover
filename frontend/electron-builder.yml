appId: com.anylover.charis
productName: Any-Lover
directories:
  buildResources: resources
  output: release/${version}
files:
  - 'dist/**/*'
  - 'out/**/*'
  - 'resources/**/*'
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
extraResources:
  # 冻结的 Python 后端 + 前端静态资源 + 模型（组装在 <root>/dist-runtime）。
  # 路径相对 frontend/（projectDir）。注意：pack.js 会用 --config 覆盖 extraResources，
  # 此处保留一份等价配置，供直接用 electron-builder 构建时也正确。
  - from: '../dist-runtime'
    to: 'runtime'
    filter:
      - '**/*'
asarUnpack:
  - resources/**
win:
  executableName: any-lover
  icon: resources/icon.ico
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  createStartMenuShortcut: true
  differentialPackage: false
  # 使用向导式安装器（非一键），让用户可以选择安装位置。
  oneClick: false
  allowToChangeInstallationDirectory: true
  # 允许在当前用户 / 全机器之间选择安装范围。
  perMachine: false
  allowElevation: true
  runAfterFinish: true
  # 卸载时删除用户数据目录（方案乙）：见 build/installer.nsh 的 customUnInstall。
  include: build/installer.nsh
mac:
  icon: resources/icon.icns
  target:
    - target: dmg
      arch: [x64, arm64]
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
  writeUpdateInfo: false
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  releaseType: release
  publishAutoUpdate: false
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/