name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # 主进程 / preload / 协议层类型检查。渲染层暂不纳入：第三方 WebSDK 有约 580 个历史报错，
      # 计划在 P4 把它移到 third_party 并单独配置（见 .kiro/specs/repo-restructure/tasks.md）。
      - name: Typecheck (main / preload / proto)
        working-directory: frontend
        run: npm run typecheck:node

      # 单元测试（主进程纯逻辑：感知管道/门控/协议解析/IPC 常量契约）
      - name: Unit tests
        working-directory: frontend
        run: npm test

      # 三进程构建（main/preload/renderer）——重构的权威回归把关
      - name: Build
        working-directory: frontend
        run: npm run build
