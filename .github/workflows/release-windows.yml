name: Release (Windows)

# 推送 v* 标签（如 v0.2.0）触发：构建 Windows 轻量版安装包（不含 Ollama / THA），
# 发布到 GitHub Releases，并上传 latest.yml 供应用内 electron-updater 检查更新。
# 也可手动触发（workflow_dispatch）只构建、上传 artifact，不发 Release。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      # 让 pack.js 保留 github publish 配置，生成 latest.yml / app-update.yml
      ANYLOVER_UPDATE_INFO: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        id: py
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-pet.txt

      - name: Sync app version with tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ver = '${{ github.ref_name }}'.TrimStart('v')
          npm --prefix frontend version $ver --no-git-tag-version --allow-same-version

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Install backend build dependencies
        run: python -m pip install -r requirements-pet.txt

      # 模型体积大（SenseVoice int8 + Kokoro），按 prepare-runtime.js 内容缓存
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: dist-runtime/models
          key: models-${{ hashFiles('build/scripts/prepare-runtime.js') }}

      - name: Fetch ffmpeg (pinned + SHA-256)
        run: node build/scripts/fetch-ffmpeg.js

      - name: Prepare runtime
        env:
          AIBOT_PYTHON: ${{ steps.py.outputs.python-path }}
        run: node build/scripts/prepare-runtime.js

      - name: Freeze backend (PyInstaller)
        env:
          AIBOT_PYTHON: ${{ steps.py.outputs.python-path }}
        run: node build/scripts/build-backend.js

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Package (NSIS, no Ollama)
        run: node build/scripts/pack.js --no-ollama

      - name: Collect artifacts
        id: art
        shell: pwsh
        run: |
          $dir = Get-ChildItem frontend/release -Directory | Sort-Object LastWriteTime | Select-Object -Last 1
          $files = Get-ChildItem $dir.FullName -File | Where-Object { $_.Name -match '\.(exe|blockmap)$' -or $_.Name -eq 'latest.yml' }
          if (-not ($files | Where-Object Name -eq 'latest.yml')) { throw 'latest.yml 未生成' }
          $files | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }
          "dir=$($dir.FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: any-lover-windows
          path: |
            ${{ steps.art.outputs.dir }}/*.exe
            ${{ steps.art.outputs.dir }}/*.blockmap
            ${{ steps.art.outputs.dir }}/latest.yml
          retention-days: 7

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = '${{ steps.art.outputs.dir }}'
          $assets = Get-ChildItem $dir -File | Where-Object { $_.Name -match '\.(exe|blockmap)$' -or $_.Name -eq 'latest.yml' } | ForEach-Object FullName
          gh release view '${{ github.ref_name }}' 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create '${{ github.ref_name }}' --title '${{ github.ref_name }}' --generate-notes $assets
          } else {
            gh release upload '${{ github.ref_name }}' $assets --clobber
          }
