name: Release (Windows)

# 推送 v* 标签（如 v0.2.0）触发：按 lite profile 构建 Windows 安装包（不含 Ollama、THA、OpenSeeFace，
# profile 定义见 apps/desktop/packaging/profiles.json），
# 发布到 GitHub Releases，并上传 latest.yml 供应用内 electron-updater 检查更新。
# 也可手动触发（workflow_dispatch）只构建、上传 artifact，不发 Release。
# CI 发布的是 lite：产物回退 Live2D、没有摄像头视线跟随（D8 的结论）。含 THA 的 win 版请在本地
# `npm run dist:win` 后用 gh release create 手动发布（见下方 check 作业，Release 已存在时跳过云端构建）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 防覆盖：标签对应的 Release 在工作流启动时已经存在，说明是手动发布的
  # （如 gh release create 直接上传本地安装包，创建 Release 时会同时创建标签并触发本工作流）。
  # 这种情况下跳过云端构建，避免用云端产物覆盖 Release 资产和 downloads 分支的分片。
  # 正常流程（只推标签）时 Release 还不存在，由下面的 build 作业在最后创建。
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.release.outputs.skip }}
    steps:
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]] && gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME 已存在（手动发布），跳过云端构建"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      # 让 tooling/package.js 保留 github publish 配置，生成 latest.yml / app-update.yml
      ANYLOVER_UPDATE_INFO: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Python
        id: py
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sidecars/open-llm-vtuber/requirements-pet.txt

      - name: Sync app version with tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ver = '${{ github.ref_name }}'.TrimStart('v')
          npm --prefix apps/desktop version $ver --no-git-tag-version --allow-same-version

      - name: Install frontend dependencies
        run: npm --prefix apps/desktop ci

      - name: Install backend build dependencies
        run: python -m pip install -r sidecars/open-llm-vtuber/requirements-pet.txt

      # 模型体积大（SenseVoice int8 + Kokoro）。stage.js 每次清空 out/stage，模型缓存在 out/downloads/models，
      # 按 manifest（下载地址与 sha256）缓存
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: out/downloads/models
          key: models-${{ hashFiles('sidecars/open-llm-vtuber/manifest.json') }}

      - name: Fetch ffmpeg (pinned + SHA-256)
        run: node sidecars/open-llm-vtuber/scripts/fetch-ffmpeg.js

      - name: Prepare runtime
        env:
          AIBOT_PYTHON: ${{ steps.py.outputs.python-path }}
        run: node sidecars/open-llm-vtuber/scripts/stage.js

      - name: Freeze backend (PyInstaller)
        env:
          AIBOT_PYTHON: ${{ steps.py.outputs.python-path }}
        run: node sidecars/open-llm-vtuber/scripts/freeze.js

      - name: Unit tests
        working-directory: apps/desktop
        run: npm test

      # 与 npm run dist:lite 等价（拆开是为了在冻结后、打包前跑单测）；lite 缺 runtime 产物会直接失败
      - name: Package (NSIS, profile lite)
        run: node tooling/package.js --profile lite

      - name: Collect artifacts
        id: art
        shell: pwsh
        run: |
          $dir = Get-ChildItem out/release -Directory | Sort-Object LastWriteTime | Select-Object -Last 1
          $files = Get-ChildItem $dir.FullName -File | Where-Object { $_.Name -match '\.(exe|blockmap)$' -or $_.Name -eq 'latest.yml' }
          if (-not ($files | Where-Object Name -eq 'latest.yml')) { throw 'latest.yml 未生成' }
          $files | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }
          "dir=$($dir.FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: any-lover-windows
          path: |
            ${{ steps.art.outputs.dir }}/*.exe
            ${{ steps.art.outputs.dir }}/*.blockmap
            ${{ steps.art.outputs.dir }}/latest.yml
          retention-days: 7

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = '${{ steps.art.outputs.dir }}'
          $assets = Get-ChildItem $dir -File | Where-Object { $_.Name -match '\.(exe|blockmap)$' -or $_.Name -eq 'latest.yml' } | ForEach-Object FullName
          gh release view '${{ github.ref_name }}' 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create '${{ github.ref_name }}' --title '${{ github.ref_name }}' --generate-notes $assets
          } else {
            gh release upload '${{ github.ref_name }}' $assets --clobber
          }

      # 官网分片下载：tooling/package.js 已把安装包切成 < 100MB 的分片（split/ + manifest.json）并校验。
      # 推到专用孤儿分支 downloads，经 raw.githubusercontent.com 提供（带 CORS，官网可在浏览器里下载并拼接）。
      # 该分支只放当前版本的分片：每次发布用单个新提交强推覆盖，不在仓库里累积历史大文件。
      # 注意：只强推 downloads 这一个分支，不影响 main 等其它分支。
      - name: Publish split parts to downloads branch
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $split = Join-Path '${{ steps.art.outputs.dir }}' 'split'
          if (-not (Test-Path (Join-Path $split 'manifest.json'))) { throw '未找到分片 manifest.json' }
          $work = Join-Path $env:RUNNER_TEMP 'downloads-branch'
          New-Item -ItemType Directory -Force $work | Out-Null
          Copy-Item (Join-Path $split '*') $work
          Set-Location $work
          git init -q -b downloads
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "downloads: ${{ github.ref_name }}"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push --force origin downloads
