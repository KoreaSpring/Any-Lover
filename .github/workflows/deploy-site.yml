name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'backend/live2d-models/**'
      - 'frontend/src/renderer/public/libs/live2dcubismcore.min.js'
      - '.github/workflows/deploy-site.yml'
  # 允许在 Actions 页面手动触发
  workflow_dispatch:

# GITHUB_TOKEN 权限：读取仓库 + 写入 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一个部署，新的推送取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      # 官网复用仓库内桌宠应用的同一套 Live2D 资源
      - name: Sync Live2D assets
        working-directory: site
        run: npm run sync:live2d

      - name: Build
        working-directory: site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # 仓库首次部署时自动启用 GitHub Pages，无需预先选择 docs 分支。
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
